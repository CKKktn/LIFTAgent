<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · LIFT AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#111111;color:#f5f5f5;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,420px);padding:40px;background:#242424;border:1px solid #626262;border-radius:24px;box-shadow:0 24px 80px #0005}h1{letter-spacing:5px;font-size:34px;margin:0 0 10px}h1 span{color:#ed6169}p{color:#cccccc;margin-bottom:32px}label{display:block;margin:20px 0 8px}input,button{width:100%;font:inherit;border-radius:10px;padding:13px 15px}input{background:#171717;color:white;border:1px solid #707070}input:focus{outline:2px solid #69d48d}button{margin-top:24px;border:0;background:#6ad58e;color:#141414;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#error{color:#ffb0b5;min-height:24px;margin-top:16px}
</style><link rel="stylesheet" href="/backgrounds.css"><script src="/backgrounds.js"></script></head><body><main><h1>LIFT <span>AI</span></h1><p id="loginHint">智能审查工作台</p><form id="login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><div id="confirmPasswordField" hidden><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button id="submit" type="submit">登录</button><div id="error" role="alert"></div></form></main>
<script src="/login.js"></script></body></html>
